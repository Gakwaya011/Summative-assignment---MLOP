services:
  - type: web
    name: vehicle-classifier-api
    env: python
    plan: free
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt &&
      python -c "import nltk; nltk.download('punkt', quiet=True)"
    startCommand: |
      gunicorn --chdir api app:app \
        --workers 1 \
        --threads 2 \
        --timeout 120 \
        --bind 0.0.0.0:$PORT \
        --worker-class gthread \
        --log-level warning
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: ENVIRONMENT
        value: "production"
    healthCheckPath: /
    autoDeploy: true

  - type: web
    name: vehicle-classifier-ui
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip &&
      pip install --no-cache-dir -r requirements.txt
    startCommand: |
      streamlit run streamlit_app/streamlit_app.py \
        --server.port $PORT \
        --server.address 0.0.0.0 \
        --server.headless true \
        --server.enableCORS false \
        --server.enableXsrfProtection false \
        --server.maxUploadSize 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ENVIRONMENT
        value: "production"
    autoDeploy: true